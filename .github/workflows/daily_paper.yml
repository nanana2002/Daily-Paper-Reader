name: Daily Paper Reader

on:
  schedule:
    # 每天北京时间早上 8 点执行 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你随时手动点击按钮运行测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # 直接在这里安装，彻底绕过 requirements.txt 报错！
        run: |
          python -m pip install --upgrade pip
          pip install arxiv requests openai

      - name: Run daily paper script
        env:
          # 这一段就是“桥梁”，确保把 Secrets 准确无误地递给 Python
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: python main.py
